<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Frame Blend auto</title>
</head>
<body>
<script>
// Hidden Frame Blend companion, started with Premiere. When the timeline
// changes, new high-frame-rate clips are set up for frame blending
// (host/frameblend.jsx, fbAutoApply).
var lastSignature = "";
setInterval(function () {
  window.__adobe_cep__.evalScript("fbAutoApply(" + JSON.stringify(lastSignature) + ")", function (result) {
    if (result && result !== "EvalScript error.") { lastSignature = result; }
  });
}, 1500);
</script>
</body>
</html>
